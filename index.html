<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>📚 Tạo bảng giúp tôi nhé</title>

  <!-- =========================================================
       SUPABASE
       QUAN TRỌNG:
       @supabase phải viết thường
       ========================================================= -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --success: #16a34a;
      --warning: #d97706;
      --input-bg: #ffffff;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    body.dark {
      --bg: #111827;
      --card: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --danger: #ef4444;
      --danger-hover: #f87171;
      --success: #22c55e;
      --warning: #f59e0b;
      --input-bg: #111827;
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 20px;
      margin-top: 20px;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--warning);
    }

    .status-dot.online {
      background: var(--success);
    }

    .status-dot.offline {
      background: var(--danger);
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      background: var(--primary);
      color: white;
      transition: 0.15s ease;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: var(--bg);
    }

    button.danger {
      background: var(--danger);
    }

    button.danger:hover {
      background: var(--danger-hover);
    }

    button.success {
      background: var(--success);
    }

    .auth-box {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .auth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr auto auto;
      gap: 10px;
      align-items: center;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 14px;
      color: var(--text);
      background: var(--input-bg);
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 220px auto auto;
      gap: 10px;
      margin-bottom: 18px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th,
    td {
      border-bottom: 1px solid var(--border);
      padding: 12px 10px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      background: var(--bg);
      font-weight: 700;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .number {
      width: 60px;
      text-align: center;
    }

    .action {
      width: 80px;
      text-align: center;
    }

    .topic-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    .debug {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 260px;
      overflow-y: auto;
    }

    .hidden {
      display: none !important;
    }

    .small {
      font-size: 12px;
      color: var(--muted);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    }

    .modal h2 {
      margin-top: 0;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    .message {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 800px) {
      .auth-grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- =========================================================
       HEADER
       ========================================================= -->
  <div>
    <h1>📚 Tạo bảng giúp tôi nhé</h1>

    <div class="subtitle">
      Collocation & English Communication —
      UI/UX · Technology · Insurance · Banking · UX
    </div>
  </div>


  <!-- =========================================================
       ACCOUNT / CLOUD STATUS
       ========================================================= -->
  <div class="card">

    <div class="top-bar">

      <div class="status">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">Đang kiểm tra kết nối...</span>
      </div>

      <div class="button-group">

        <button
          class="secondary"
          type="button"
          onclick="toggleDarkMode()"
        >
          🌙 Dark mode
        </button>

        <button
          class="secondary"
          type="button"
          onclick="backupData()"
        >
          💾 Backup
        </button>

        <button
          class="secondary"
          type="button"
          onclick="document.getElementById('restoreFile').click()"
        >
          ♻️ Restore
        </button>

        <button
          class="secondary"
          type="button"
          onclick="exportCSV()"
        >
          📄 CSV
        </button>

        <input
          id="restoreFile"
          type="file"
          accept=".json"
          class="hidden"
          onchange="restoreData(event)"
        />

      </div>

    </div>


    <!-- AUTH -->
    <div class="auth-box">

      <div class="auth-grid">

        <input
          id="email"
          type="email"
          placeholder="Email"
          autocomplete="email"
        />

        <input
          id="password"
          type="password"
          placeholder="Mật khẩu"
          autocomplete="current-password"
        />

        <button
          type="button"
          onclick="login()"
        >
          🔐 Đăng nhập
        </button>

        <button
          type="button"
          class="secondary"
          onclick="register()"
        >
          ✨ Đăng ký
        </button>

      </div>

      <div class="button-group" style="margin-top:10px;">

        <button
          type="button"
          class="secondary"
          onclick="logout()"
        >
          Đăng xuất
        </button>

        <button
          type="button"
          class="secondary"
          onclick="testSupabaseConnection()"
        >
          🧪 Test Supabase
        </button>

      </div>

      <div id="authMessage" class="message"></div>

    </div>

  </div>


  <!-- =========================================================
       MAIN DATA
       ========================================================= -->
  <div class="card">

    <div class="toolbar">

      <input
        id="searchInput"
        type="text"
        placeholder="🔎 Tìm collocation, ví dụ..."
        oninput="renderTable()"
      />

      <select
        id="topicFilter"
        onchange="renderTable()"
      >
        <option value="">Tất cả chủ đề</option>
      </select>

      <button
        type="button"
        onclick="openAddModal()"
      >
        + Thêm collocation
      </button>

      <button
        type="button"
        class="danger"
        onclick="clearAll()"
      >
        Xóa tất cả
      </button>

    </div>


    <!-- TABLE -->
    <div class="table-wrapper">

      <table>

        <thead>
          <tr>
            <th class="number">STT</th>
            <th>Collocation</th>
            <th>Chủ đề</th>
            <th>Câu giao tiếp ví dụ</th>
            <th class="action">Xóa</th>
          </tr>
        </thead>

        <tbody id="tableBody"></tbody>

      </table>

    </div>

  </div>


  <!-- =========================================================
       DEBUG
       ========================================================= -->
  <div class="debug" id="debugLog">
Đang khởi động...
  </div>

</div>


<!-- =========================================================
     ADD MODAL
     ========================================================= -->

<div
  id="addModal"
  class="modal-overlay hidden"
  onclick="closeModalOutside(event)"
>

  <div class="modal">

    <h2>➕ Thêm collocation</h2>

    <div class="form-grid">

      <div class="field">

        <label>Collocation</label>

        <input
          id="newCollocation"
          type="text"
          placeholder="Ví dụ: work on a project"
        />

      </div>


      <div class="form-row">

        <div class="field">

          <label>Chủ đề</label>

          <input
            id="newTopic"
            type="text"
            placeholder="Ví dụ: Work"
          />

        </div>

        <div class="field">

          <label>Level</label>

          <select id="newLevel">
            <option value="">Chưa xác định</option>
            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="B1">B1</option>
            <option value="B2">B2</option>
            <option value="C1">C1</option>
            <option value="C2">C2</option>
          </select>

        </div>

      </div>


      <div class="field">

        <label>Câu giao tiếp ví dụ</label>

        <textarea
          id="newExample"
          rows="4"
          placeholder="Ví dụ: I'm currently working on a new banking app."
        ></textarea>

      </div>


      <div class="field">

        <label>Nghĩa tiếng Việt</label>

        <input
          id="newMeaning"
          type="text"
          placeholder="Ví dụ: đang làm một dự án"
        />

      </div>


      <div class="field">

        <label>Notes</label>

        <input
          id="newNotes"
          type="text"
          placeholder="Ghi chú thêm..."
        />

      </div>

    </div>


    <div class="modal-actions">

      <button
        type="button"
        class="secondary"
        onclick="closeAddModal()"
      >
        Hủy
      </button>

      <button
        type="button"
        onclick="addCollocation()"
      >
        Thêm
      </button>

    </div>

  </div>

</div>


<script>
/* ============================================================
   CONFIGURATION
   ============================================================

   Supabase Project:
   https://abvdosqnbwoscbvzsjde.supabase.co

   QUAN TRỌNG:
   Đây phải là PUBLISHABLE KEY của đúng project Supabase.

   Không sử dụng:
   - sb_secret_...
   - service_role
   - database password

   Publishable key có thể nằm trong frontend.
   ============================================================ */

const SUPABASE_URL =
  "https://abvdosqnbwoscbvzsjde.supabase.co";

/*
   Nếu key dưới đây không còn là key hiện tại trong
   Supabase Dashboard → Settings → API Keys,
   hãy thay nó bằng Publishable key hiện tại.
*/
const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_qyAV3nNQksO3RXxMyPS0g_whEtuG";


/* ============================================================
   LOCAL STORAGE
   ============================================================ */

const LOCAL_STORAGE_KEY = "english_collocations_data";

const DARK_MODE_KEY = "english_collocations_dark_mode";


/* ============================================================
   SUPABASE CLIENT
   ============================================================ */

let supabaseClient = null;


/* ============================================================
   APP STATE
   ============================================================ */

let collocations = [];

let currentUser = null;

let isSyncing = false;


/* ============================================================
   DEBUG
   ============================================================ */

function debug(message, data = null) {

  const log = document.getElementById("debugLog");

  if (!log) return;

  const time =
    new Date().toLocaleTimeString("vi-VN");

  let text =
    `[${time}] ${message}`;

  if (data !== null) {

    try {

      text +=
        "\n" +
        JSON.stringify(
          data,
          null,
          2
        );

    } catch (e) {

      text +=
        "\n" +
        String(data);

    }

  }

  log.textContent =
    text +
    "\n\n" +
    log.textContent;

}


function setAuthMessage(message) {

  const el =
    document.getElementById("authMessage");

  if (el) {
    el.textContent = message;
  }

}


/* ============================================================
   INITIALIZE SUPABASE
   ============================================================ */

function initializeSupabase() {

  debug("Đang khởi tạo Supabase...");

  /*
    Nếu CDN không load:
    window.supabase sẽ undefined.
  */

  if (!window.supabase) {

    debug(
      "❌ Không tìm thấy window.supabase. Kiểm tra CDN."
    );

    setStatus(
      "offline",
      "Không tải được Supabase JS"
    );

    return false;
  }


  /*
    Kiểm tra URL.
  */

  if (
    !SUPABASE_URL ||
    !SUPABASE_URL.startsWith("https://")
  ) {

    debug(
      "❌ SUPABASE_URL không hợp lệ."
    );

    return false;
  }


  /*
    Kiểm tra Publishable Key.
  */

  if (
    !SUPABASE_PUBLISHABLE_KEY ||
    !SUPABASE_PUBLISHABLE_KEY.startsWith(
      "sb_publishable_"
    )
  ) {

    debug(
      "❌ Publishable key không hợp lệ hoặc chưa được thay."
    );

    setStatus(
      "offline",
      "Supabase key không hợp lệ"
    );

    return false;
  }


  try {

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    debug(
      "✅ Supabase client đã khởi tạo.",
      {
        url: SUPABASE_URL,
        keyPrefix:
          SUPABASE_PUBLISHABLE_KEY.substring(
            0,
            20
          ) + "..."
      }
    );

    return true;

  } catch (error) {

    debug(
      "❌ Không thể khởi tạo Supabase.",
      error
    );

    setStatus(
      "offline",
      "Không thể khởi tạo Supabase"
    );

    return false;
  }

}


/* ============================================================
   STATUS
   ============================================================ */

function setStatus(type, text) {

  const dot =
    document.getElementById("statusDot");

  const statusText =
    document.getElementById("statusText");


  if (dot) {

    dot.className =
      "status-dot " +
      (
        type === "online"
          ? "online"
          : type === "offline"
            ? "offline"
            : ""
      );

  }


  if (statusText) {
    statusText.textContent = text;
  }

}


/* ============================================================
   LOCAL STORAGE
   ============================================================ */

function loadLocalData() {

  try {

    const raw =
      localStorage.getItem(
        LOCAL_STORAGE_KEY
      );


    if (!raw) {

      collocations =
        getDefaultData();

      saveLocalData();

      debug(
        "Local chưa có dữ liệu → tạo dữ liệu mẫu."
      );

      return;
    }


    const parsed =
      JSON.parse(raw);


    if (Array.isArray(parsed)) {

      collocations =
        parsed;

    } else {

      collocations =
        getDefaultData();

      saveLocalData();

    }


    debug(
      `Đã tải ${collocations.length} dòng từ localStorage.`
    );

  } catch (error) {

    debug(
      "❌ Lỗi đọc localStorage.",
      error
    );

    collocations =
      getDefaultData();

  }

}


function saveLocalData() {

  try {

    localStorage.setItem(
      LOCAL_STORAGE_KEY,
      JSON.stringify(collocations)
    );

  } catch (error) {

    debug(
      "❌ Không thể lưu localStorage.",
      error
    );

  }

}


/* ============================================================
   DEFAULT DATA
   ============================================================ */

function getDefaultData() {

  return [

    {
      id:
        crypto.randomUUID
          ? crypto.randomUUID()
          : String(Date.now()) + "-1",

      collocation:
        "work on a project",

      topic:
        "Work",

      example:
        "I'm currently working on a new banking app.",

      meaning_vi:
        "",

      level:
        "B1",

      notes:
        ""
    },


    {
      id:
        crypto.randomUUID
          ? crypto.randomUUID()
          : String(Date.now()) + "-2",

      collocation:
        "improve user experience",

      topic:
        "UI/UX",

      example:
        "We need to improve the user experience.",

      meaning_vi:
        "",

      level:
        "B1",

      notes:
        ""
    },


    {
      id:
        crypto.randomUUID
          ? crypto.randomUUID()
          : String(Date.now()) + "-3",

      collocation:
        "meet a deadline",

      topic:
        "Work",

      example:
        "We need to meet the deadline by Friday.",

      meaning_vi:
        "",

      level:
        "B1",

      notes:
        ""
    }

  ];

}


/* ============================================================
   RENDER TABLE
   ============================================================ */

function renderTable() {

  const body =
    document.getElementById("tableBody");

  const search =
    (
      document.getElementById(
        "searchInput"
      ).value || ""
    )
      .trim()
      .toLowerCase();


  const topic =
    document.getElementById(
      "topicFilter"
    ).value;


  const filtered =
    collocations.filter(item => {

      const text =
        [
          item.collocation,
          item.topic,
          item.example,
          item.meaning_vi,
          item.notes
        ]
          .join(" ")
          .toLowerCase();


      const matchesSearch =
        !search ||
        text.includes(search);


      const matchesTopic =
        !topic ||
        item.topic === topic;


      return (
        matchesSearch &&
        matchesTopic
      );

    });


  if (!filtered.length) {

    body.innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            Chưa có collocation nào.
          </div>
        </td>
      </tr>
    `;

    return;
  }


  body.innerHTML =
    filtered
      .map((item, index) => {

        const originalIndex =
          collocations.indexOf(item);


        return `
          <tr>

            <td class="number">
              ${index + 1}
            </td>

            <td>
              <strong>
                ${escapeHtml(
                  item.collocation || ""
                )}
              </strong>
            </td>

            <td>
              ${
                item.topic
                  ? `
                    <span class="topic-badge">
                      ${escapeHtml(
                        item.topic
                      )}
                    </span>
                  `
                  : ""
              }
            </td>

            <td>
              ${escapeHtml(
                item.example || ""
              )}
            </td>

            <td class="action">

              <button
                type="button"
                class="danger"
                onclick="deleteCollocation(${originalIndex})"
                title="Xóa"
              >
                🗑️
              </button>

            </td>

          </tr>
        `;

      })
      .join("");

}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ============================================================
   TOPIC FILTER
   ============================================================ */

function updateTopicFilter() {

  const select =
    document.getElementById(
      "topicFilter"
    );


  const currentValue =
    select.value;


  const topics =
    [
      ...new Set(
        collocations
          .map(item => item.topic)
          .filter(Boolean)
      )
    ]
      .sort();


  select.innerHTML = `
    <option value="">
      Tất cả chủ đề
    </option>
  `;


  topics.forEach(topic => {

    const option =
      document.createElement("option");

    option.value =
      topic;

    option.textContent =
      topic;

    select.appendChild(option);

  });


  if (

   MIGRATE LOCAL → CLOUD
   ============================================================ */

async function uploadLocalToCloud() {

  if (
    !currentUser ||
    !supabaseClient
  ) {

    return false;

  }


  if (!collocations.length) {

    return true;

  }


  debug(
    `☁️ Đang upload ${collocations.length} dòng local lên Supabase...`
  );


  try {

    const rows =
      collocations.map(item => ({

        collocation:
          item.collocation || "",

        topic:
          item.topic || "",

        example:
          item.example || "",

        meaning_vi:
          item.meaning_vi || "",

        level:
          item.level || "",

        notes:
          item.notes || "",

        user_id:
          currentUser.id

      }));


    const {
      data,
      error
    } =
      await supabaseClient
        .from("collocations")
        .insert(rows)
        .select();


    if (error) {

      debug(
        "❌ Upload local → cloud lỗi.",
        error
      );

      return false;

    }

      data;


    saveLocalData();

    updateTopicFilter();

    renderTable();


    debug(
      `✅ Đã upload ${data.length} dòng lên Supabase.`

/* ============================================================
   HANDLE LOGIN SESSION
   ============================================================ */

async function handleSession() {

  if (!supabaseClient) {

    return;

  }


  debug(
    "🔍 Đang kiểm tra session..."
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      debug(
        "❌ getSession lỗi.",
        error
      );

      setStatus(
        "offline",
        "Supabase Auth lỗi"
      );

      return;

    }


    currentUser =
      data.session
        ? data.session.user
        : null;


    if (currentUser) {

      debug(
        "✅ Đã có session.",
        {
          userId:
            currentUser.id,

          email:
            currentUser.email
        }
      );


      await syncAfterLogin();

    } else {

      setStatus(
        "online",
        "Chưa đăng nhập — đang dùng local"
      );


      debug(
        "ℹ️ Chưa đăng nhập."
      );

    }

  } catch (error) {

    debug(
      "❌ Exception handleSession.",
      error
    );

  }

}


/* ============================================================
   SYNC AFTER LOGIN
   ============================================================ */

async function syncAfterLogin() {

  if (
    !currentUser ||
    !supabaseClient
  ) {

    return;

  }


  if (isSyncing) {

    return;

  }


  isSyncing = true;


  try {

    setStatus(
      "online",
      `Đã đăng nhập: ${currentUser.email}`
    );


    const cloudData =
      await fetchCloudData();


    if (cloudData === null) {

      debug(
        "⚠️ Không lấy được cloud data. Giữ local."
      );

      return;

    }


    /*
      Trường hợp 1:
      Cloud trống + local có dữ liệu
      → upload local lên cloud.
    */

    if (
      cloudData.length === 0 &&
      collocations.length > 0
    ) {

      debug(
        "☁️ Cloud đang trống → chuyển dữ liệu local lên cloud."
      );


      await uploadLocalToCloud();

      return;

    }


    /*
      Trường hợp 2:
      Cloud có dữ liệu
      → cloud là nguồn chính.
    */

    collocations =
      cloudData;

    saveLocalData();

    updateTopicFilter();

    renderTable();


    debug(
      `✅ Đồng bộ hoàn tất: ${cloudData.length} dòng.`
    );

  } finally {

    isSyncing = false;

  }

}


/* ============================================================
   LOGIN
   ============================================================ */

async function login() {

  if (!supabaseClient) {

    alert(
      "Supabase chưa được khởi tạo."
    );

    return;

  }


  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  if (!email || !password) {

    alert(
      "Vui lòng nhập email và mật khẩu."
    );

    return;

  }


  setAuthMessage(
    "Đang đăng nhập..."
  );


  debug(
    "🔐 Đang login...",
    {
      email,
      keyPrefix:
        SUPABASE_PUBLISHABLE_KEY.substring(
          0,
          20
        ) + "..."
    }
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });


    if (error) {

      /*
        Đây chính là nơi lỗi
        "Invalid API key" xuất hiện nếu
        Supabase không chấp nhận API key.
      */

      debug(
        "❌ Login lỗi.",
        {
          message:
            error.message,

          name:
            error.name,

          status:
            error.status
        }
      );


      setAuthMessage(
        "❌ " +
        error.message
      );


      /*
        Gợi ý riêng cho Invalid API key.
      */

      if (
        error.message
          .toLowerCase()
          .includes("invalid api key")
      ) {

        alert(
          "Supabase báo Invalid API key.\n\n" +
          "Hãy kiểm tra:\n" +
          "1. Supabase → Settings → API Keys\n" +
          "2. Copy Publishable key hiện tại\n" +
          "3. Thay giá trị SUPABASE_PUBLISHABLE_KEY trong index.html\n" +
          "4. Không dùng sb_secret_...\n" +
          "5. Save → GitHub → chờ Pages deploy → Cmd + Shift + R"
        );

      }

      return;

    }


    currentUser =
      data.user;


    setAuthMessage(
      "✅ Đăng nhập thành công."
    );


    debug(
      "✅ Login thành công.",
      {
        userId:
          currentUser?.id,

        email:
          currentUser?.email
      }
    );


    await syncAfterLogin();

  } catch (error) {

    debug(
      "❌ Exception login.",
      error
    );


    setAuthMessage(
      "❌ Login lỗi: " +
      error.message
    );

  }

}


/* ============================================================
   REGISTER
   ============================================================ */

async function register() {

  if (!supabaseClient) {

    alert(
      "Supabase chưa được khởi tạo."
    );

    return;

  }


  const email =

      .getElementById("email")

      .value;

    );

    return;

  }


  if (password.length < 6) {

    alert(

    );

    return;

  }


  setAuthMessage(
    "Đang tạo tài khoản..."
  );


  debug(
    "✨ Đang đăng ký...",
    {
      email
    }
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({
        email,
        password
      });


    if (error) {

      debug(
        "❌ Register lỗi.",
        error
      );


      setAuthMessage(
        "❌ " +
        error.message
      );

      return;

    }


    debug(

    );

  }

/* ============================================================
   AUTH STATE CHANGE
   ============================================================ */

function setupAuthListener() {

  if (!supabaseClient) {

    return;

  }


  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      debug(
        `🔄 Auth event: ${event}`
      );


      currentUser =
        session
          ? session.user
          : null;


      if (session) {

        /*
          Tránh sync nếu handleSession()
          đã xử lý rồi.
        */

        if (event !== "INITIAL_SESSION") {

          await syncAfterLogin();

        }

      } else {

        setStatus(
          "online",
          "Chưa đăng nhập — đang dùng local"
        );

      }

    }
  );

}

/* ============================================================
   RESTORE
   ============================================================ */

async function restoreData(event) {

  const file =
    event.target.files[0];


  if (!file) return;


  try {

    const text =
      await file.text();


    const parsed =
      JSON.parse(text);


    let restoredData;


    if (
      Array.isArray(parsed)
    ) {

      restoredData =
        parsed;

    } else if (
      Array.isArray(parsed.data)
    ) {

      restoredData =
        parsed.data;

    } else {

      throw new Error(
        "File backup không đúng định dạng."
      );

    }


    const confirmed =
      confirm(
        `Restore ${restoredData.length} dòng dữ liệu?`
      );


    if (!confirmed) {

      event.target.value = "";

      return;

    }


    /*
      Nếu đang login:
      Xóa cloud rồi insert lại.
    */

    if (
      currentUser &&
      supabaseClient
    ) {

      debug(
        "☁️ Đang restore dữ liệu lên cloud..."
      );


      const {
        error: deleteError
      } =
        await supabaseClient
          .from("collocations")
          .delete()
          .eq(
            "user_id",
            currentUser.id
          );


      if (deleteError) {

        debug(
          "❌ Không thể xóa dữ liệu cloud trước restore.",
          deleteError
        );

        alert(
          deleteError.message
        );

        return;

      }


      const rows =
        restoredData.map(item => ({

          collocation:
            item.collocation || "",

          topic:
            item.topic || "",

          example:
            item.example || "",

          meaning_vi:
            item.meaning_vi || "",

          level:
            item.level || "",

          notes:
            item.notes || "",

          user_id:
            currentUser.id

        }));


      if (rows.length) {

        const {
          data,
          error
        } =
          await supabaseClient
            .from("collocations")
            .insert(rows)
            .select();


        if (error) {

          debug(
            "❌ Restore cloud lỗi.",
            error
          );

          alert(
            error.message
          );

          return;

        }


        collocations =
          data;

      } else {

        collocations = [];

      }


    } else {

      /*
        Chưa login:
        chỉ restore local.
      */

      collocations =
        restoredData;

    }


    saveLocalData();

    updateTopicFilter();

    renderTable();


    debug(
      `♻️ Restore thành công: ${collocations.length} dòng.`
    );


    alert(
      "Restore thành công."
    );

  } catch (error) {

    debug(
      "❌ Restore lỗi.",
      error
    );


    alert(
      "Không thể restore file:\n" +
      error.message
    );

  }


  event.target.value = "";

}


/* ============================================================
   EXPORT CSV
   ============================================================ */

function exportCSV() {

  const headers = [
    "STT",
    "Collocation",
    "Topic",
    "Example",
    "Meaning Vietnamese",
    "Level",
    "Notes"
  ];


  const rows =
    collocations.map(
      (item, index) => [

        index + 1,

        item.collocation || "",

        item.topic || "",

        item.example || "",

        item.meaning_vi || "",

        item.level || "",

        item.notes || ""

      ]
    );


  const csv = [

    headers,

    ...rows

  ]
    .map(row =>
      row
        .map(value =>
          `"${String(value)
            .replaceAll('"', '""')}"`
        )
        .join(",")
    )
    .join("\n");


  const blob =
    new Blob(
      [
        "\uFEFF" + csv
      ],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href =
    url;


  a.download =
    "english-collocations.csv";


  document.body.appendChild(a);

  a.click();

  a.remove();


  URL.revokeObjectURL(url);


  debug(
    "📄 Đã export CSV."
  );

}

  );


  localStorage.setItem(
    DARK_MODE_KEY,

  );

}

   ONLINE / OFFLINE
   ============================================================ */

window.addEventListener(
  "online",
  () => {

    debug(
      "🌐 Internet đã kết nối lại."
    );

    if (currentUser) {

      syncAfterLogin();

    }

  }
);


window.addEventListener(
  "offline",
  () => {

    debug(
      "⚠️ Mất kết nối Internet."
    );


    setStatus(
      "offline",
      "Offline — đang dùng local"
    );

  }
);


/* ============================================================
   KEYBOARD SHORTCUT
   ============================================================ */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Escape"
    ) {

      const modal =
        document.getElementById(
          "addModal"
        );


      if (
        modal &&
        !modal.classList.contains(
          "hidden"
        )
      ) {

        closeAddModal();

      }

    }

  }
);


/* ============================================================
   INITIALIZATION
   ============================================================ */

async function init() {

  debug(
    "🚀 Khởi động English Collocations App..."
  );


  loadDarkMode();

  loadLocalData();

  updateTopicFilter();

  renderTable();


  /*
    Khởi tạo Supabase.
  */

  const supabaseReady =
    initializeSupabase();


  if (!supabaseReady) {

    setStatus(
      "offline",
      "Supabase chưa sẵn sàng — đang dùng local"
    );

    return;

  }


  /*
    Đăng ký listener trước.
  */

  setupAuthListener();


  /*
    Kiểm tra session hiện tại.
  */

  await handleSession();


  debug(
    "✅ App đã khởi động xong."
  );

}


/* ============================================================
   START
   ============================================================ */

init();

</script>

</body>
</html>
