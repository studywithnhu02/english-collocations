name: Preview Spellcheck Tests

on:
  push:
    paths:
      - 'preview/**'
      - '.github/workflows/preview-spellcheck.yml'
  pull_request:
    paths:
      - 'preview/**'
      - '.github/workflows/preview-spellcheck.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install spellcheck runtime
        run: npm install --no-save nspell@2.1.5
      - name: Syntax check
        run: |
          node --check preview/spellcheck.js
          node --check preview/spellcheck-worker.js
          node --check preview/spellcheck-core.mjs
          node --check preview/status-core.mjs
          node --check preview/analytics-core.mjs
          node --check preview/collocation-core.mjs
          node --check preview/analytics-ui.js
          node --check preview/contextual-story-core.mjs
          node --check preview/ai-agent.js
          node --check preview/ai-client.js
          node --check preview/smart-ingestion.js
          node --check preview/quiz-ui.js
          node --check preview/focus-ui.js
          node --check preview/family-ui.js
          node --check preview/coverage-ui.js
          node --check preview/coach-ui.js
          node --check preview/anki-export.js
          node --check preview/print-export.js
      - name: Core regression tests
        run: node --test preview/tests/spellcheck-core.test.mjs
      - name: Runtime dictionary tests
        run: node preview/tests/spellcheck-runtime.test.mjs
      - name: Auto Translate core tests
        run: node --test preview/tests/auto-translate-core.test.mjs
      - name: Auto Translate syntax check
        run: node --check preview/auto-translate.js
          
      - name: Feature module syntax check
        run: |
          node --check preview/auth-gate.js
          node --check preview/goals-ui.js
          node --check preview/srs-ui.js
          node --check preview/smart-tools.js
          node --check preview/goals-core.mjs
          node --check preview/srs-core.mjs
          node --check preview/smart-tools-core.mjs
          node --check preview/quiz-core.mjs
          node --check preview/focus-core.mjs
          node --check preview/family-core.mjs
          node --check preview/coverage-core.mjs
          node --check preview/coach-core.mjs
          node --check preview/vocabulary-core.mjs
      - name: Analytics core tests
        run: node --test preview/tests/analytics-core.test.mjs
      - name: Collocation core tests
        run: node --test preview/tests/collocation-core.test.mjs
      - name: Status core tests
        run: node --test preview/tests/status-core.test.mjs
      - name: Status Preview contract tests
        run: node --test preview/tests/status-preview.test.mjs
      - name: Analytics UI contract tests
        run: node --test preview/tests/analytics-ui.test.mjs
      - name: Contextual Story core tests
        run: node --test preview/tests/contextual-story-core.test.mjs
      - name: Goals core tests
        run: node --test preview/tests/goals-core.test.mjs
      - name: SRS core tests
        run: node --test preview/tests/srs-core.test.mjs
      - name: Smart Tools core tests
        run: node --test preview/tests/smart-tools-core.test.mjs
      - name: Auth Preview contract tests
        run: node --test preview/tests/auth-preview.test.mjs
      - name: Feature Preview UI contract tests
        run: node --test preview/tests/feature-preview-ui.test.mjs
      - name: Spellcheck Preview contract tests
        run: node --test preview/tests/spellcheck-preview.test.mjs
      - name: Analytics + duplicate Preview contract tests
        run: node --test preview/tests/analytics-duplicate-preview.test.mjs

# CI regression gate: rerun after spellcheck core fix.

      - name: Vocabulary Intelligence core tests
        run: |
          node --test preview/tests/vocabulary-core.test.mjs
          node --test preview/tests/quiz-core.test.mjs
          node --test preview/tests/focus-core.test.mjs
          node --test preview/tests/coverage-core.test.mjs
          node --test preview/tests/coach-core.test.mjs
      - name: Vocabulary Intelligence UI and security tests
        run: |
          node --test preview/tests/vocabulary-preview-ui.test.mjs
          node --test preview/tests/security-preview.test.mjs
          node --test preview/tests/export-preview.test.mjs
