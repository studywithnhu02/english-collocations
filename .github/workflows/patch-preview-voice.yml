name: Patch Preview Voice Clone

on:
  push:
    branches: [main]
    paths:
      - 'preview/voice-server/**'
      - '.github/workflows/patch-preview-voice.yml'

permissions:
  contents: write

jobs:
  patch-preview:
    if: ${{ !contains(github.event.head_commit.message, '[voice-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Preview
        run: python3 preview/voice-server/patch_preview_voice.py

      - name: Commit Preview patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/index.html
          if git diff --cached --quiet; then
            echo "No Preview changes needed."
            exit 0
          fi
          git commit -m "Connect Preview to local XTTS voice clone [voice-patch]"
          git push
