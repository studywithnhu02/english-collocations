name: Add Preview update status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-status.yml'

permissions:
  contents: write

jobs:
  inject-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Preview status widget
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          p=Path('preview/index.html')
          s=p.read_text(encoding='utf-8')
          build=os.environ['BUILD_SHA']
          marker='preview-update-status-v2'
          js='''<script id="preview-update-status-v2">
          (()=>{
            const expected="__BUILD_SHA__";
            const raw=`https://raw.githubusercontent.com/studywithnhu02/english-collocations/main/preview/index.html`;
            const dot=document.getElementById('pusDot'),title=document.getElementById('pusTitle'),sub=document.getElementById('pusSub'),time=document.getElementById('pusTime');
            const set=(kind,t,s)=>{if(dot)dot.className='pus-dot '+kind;if(title)title.textContent=t;if(sub)sub.textContent=s;if(time)time.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});};
            async function check(){
              set('busy','Đang kiểm tra…','Đang so sánh phiên bản Preview đang chạy với source GitHub.');
              try{
                const r=await fetch(raw+'?t='+Date.now(),{cache:'no-store'});
                if(!r.ok) throw new Error('HTTP '+r.status);
                const text=await r.text();
                const m=text.match(/data-preview-build="([0-9a-f]{7,40})"/i);
                const live=m?m[1]:'';
                if(live && expected.startsWith(live.slice(0,7))){
                  set('ok','🟢 Preview đã cập nhật','Bản Preview hiện tại khớp với source GitHub · '+live.slice(0,7)+'.');
                }else{
                  set('busy','🟡 Đang cập nhật Preview','GitHub đã có bản mới · '+expected.slice(0,7)+'; Pages có thể đang propagate.');
                }
              }catch(e){set('err','⚠️ Không kiểm tra được','Không đọc được source GitHub. Bạn vẫn có thể reload thủ công.');}
            }
            document.getElementById('pusCheck')?.addEventListener('click',check);
            document.getElementById('pusReload')?.addEventListener('click',()=>location.reload());
            check(); setInterval(check,15000);
          })();
          </script>'''.replace('__BUILD_SHA__', build)
          # Keep the existing widget UI, but replace its old script and add a build marker.
          if 'preview-update-status-v1' in s:
              s=s.replace('preview-update-status-v1','preview-update-status-v2')
          if 'id="preview-update-status-v2"' in s:
              s=re.sub(r'<script id="preview-update-status-v2">.*?</script>',js,s,count=1,flags=re.S)
          else:
              s=s.replace('</body>',js+'\n</body>',1)
          if 'id="previewUpdateStatus"' in s:
              s=re.sub(r'(<div id="previewUpdateStatus"[^>]*)(>)',r'\1 data-preview-build="'+build+r'"\2',s,count=1)
          else:
              raise SystemExit('Preview status widget not found')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit Preview widget update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/index.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'Fix Preview update status detection'
            git push
          fi
