name: Validate grammar UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate grammar UI JavaScript
        run: |
          node --check preview/grammar-ui.js
          grep -q 'GRAMMAR_COLLAPSE_KEY' preview/grammar-ui.js
          grep -q 'data-chapter-toggle' preview/grammar-ui.js
          grep -q 'renderUnitGroups' preview/grammar-ui.js
          echo 'Grammar UI syntax + chapter collapse markers: PASS'
      - name: Remove temporary workflow
        run: |
          git config user.name 'studywithnhu02'
          git config user.email 'studywithnhu02@gmail.com'
          git rm .github/workflows/validate-grammar-ui.yml
          git commit -m 'chore: remove temporary grammar UI validation workflow'
          git push origin HEAD:main
