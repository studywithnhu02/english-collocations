name: One-time preview UI cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove grammar learning tip strip
        shell: python
        run: |
          from pathlib import Path
          path = Path('preview/app.html')
          text = path.read_text(encoding='utf-8')
          marker = '</head>'
          css = '''\n<style id="grammar-note-removal">\n/* Remove the auxiliary 3-step learning tip strip; keep the grammar workspace content unchanged. */\nbody.grammar-mode .grammar2-layout{grid-template-rows:91px minmax(0,1fr)!important}\nbody.grammar-mode .grammar2-note{display:none!important}\nbody.grammar-mode .grammar2-body{grid-row:2!important}\n</style>\n'''
          if 'id="grammar-note-removal"' not in text:
              if marker not in text:
                  raise SystemExit('Could not find </head> in preview/app.html')
              text = text.replace(marker, css + marker, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit preview change and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-remove-grammar-note.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/app.html .github/workflows/one-time-remove-grammar-note.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: remove grammar learning tip strip from preview"
          git push