name: Preview add created date column

on:
  push:
    paths:
      - '.github/workflows/preview-add-created-date.yml'

permissions:
  contents: write

jobs:
  patch-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch preview
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('preview/index.html')
          text = path.read_text(encoding='utf-8')

          if '<th>Ngày tạo</th>' in text:
              print('Created-date column already exists; nothing to do.')
          else:
              text = text.replace('<th>Nghĩa câu ví dụ</th><th>Xóa</th>', '<th>Nghĩa câu ví dụ</th><th>Ngày tạo</th><th>Xóa</th>', 1)
              text = text.replace('.translation.translating{color:var(--yellow);font-style:italic}', '.translation.translating{color:var(--yellow);font-style:italic}.date{color:var(--muted);white-space:nowrap}', 1)
              text = text.replace('function render(){', "function formatDate(value){if(!value)return '';const d=new Date(value);if(Number.isNaN(d.getTime()))return '';return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});}\nfunction render(){", 1)
              text = text.replace('<td class="editable translation" contenteditable data-f="em">${esc(x.em)}</td><td class="row-actions">', '<td class="editable translation" contenteditable data-f="em">${esc(x.em)}</td><td class="date">${formatDate(x.createdAt)}</td><td class="row-actions">', 1)
              text = text.replace('<td class="editable translation" contenteditable data-f="em"></td><td class="row-actions"><button class="save" onclick="saveNewRow', '<td class="editable translation" contenteditable data-f="em"></td><td class="date">${formatDate(new Date().toISOString())}</td><td class="row-actions"><button class="save" onclick="saveNewRow', 1)
              text = text.replace("return structuredClone(DEFAULT_DATA)}", "return structuredClone(DEFAULT_DATA).map(x=>({...x,createdAt:new Date().toISOString()}))}", 1)
              text = text.replace("return parsed}}catch(e){}return structuredClone(DEFAULT_DATA)", "return parsed.map(x=>({...x,createdAt:x.createdAt||new Date().toISOString()}))}}catch(e){}return structuredClone(DEFAULT_DATA).map(x=>({...x,createdAt:new Date().toISOString()}))", 1)
              text = text.replace('data.push({id:', 'data.push({id:', 1)
              text = re.sub(r'(data\.push\(\{id:[^,]+,)', r'\1createdAt:new Date().toISOString(),', text, count=1)
              path.write_text(text, encoding='utf-8')
              print('Preview patched.')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          text = Path('preview/index.html').read_text(encoding='utf-8')
          required = ['<th>Ngày tạo</th>', 'formatDate(', 'createdAt']
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing expected changes: {missing}')
          print('Validation passed.')

      - name: Commit preview change and remove temporary workflow
        run: |
          rm -f .github/workflows/preview-add-created-date.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/index.html .github/workflows/preview-add-created-date.yml
          git diff --cached --quiet && echo 'No changes to commit.' && exit 0
          git commit -m 'Update preview with created date column'
          git push
