name: Add Preview Update Status

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-status-widget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Preview update widget
        shell: python
        run: |
          from pathlib import Path
          p = Path('preview/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- preview-update-status-widget -->'
          if marker in s:
              print('Widget already installed')
              raise SystemExit(0)
          block = r'''<!-- preview-update-status-widget -->
<style>
#previewUpdateStatus{position:fixed;left:16px;bottom:16px;z-index:99999;width:min(390px,calc(100vw - 32px));background:var(--card,#1c2738);color:var(--text,#f4f7fb);border:1px solid var(--line,#344257);border-radius:14px;box-shadow:0 12px 35px #0004;padding:11px 13px;font:12px/1.4 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;backdrop-filter:blur(10px)}
#previewUpdateStatus .pus-row{display:flex;align-items:center;gap:8px}#previewUpdateStatus .pus-dot{width:9px;height:9px;border-radius:50%;background:#36c98b;flex:none}#previewUpdateStatus[data-state="checking"] .pus-dot{background:#f5c451}#previewUpdateStatus[data-state="new"] .pus-dot{background:#2f80ff}#previewUpdateStatus[data-state="error"] .pus-dot{background:#ff686d}#previewUpdateStatus .pus-title{font-weight:800;flex:1}#previewUpdateStatus .pus-time{color:var(--muted,#9aa8bd);font-size:10px}#previewUpdateStatus .pus-detail{color:var(--muted,#9aa8bd);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#previewUpdateStatus .pus-actions{display:flex;gap:6px;margin-top:8px}#previewUpdateStatus button{border:1px solid var(--line,#344257);background:transparent;color:inherit;border-radius:8px;padding:5px 8px;font-size:10px;cursor:pointer}#previewUpdateStatus button:hover{filter:brightness(1.1)}#previewUpdateStatus .pus-bar{height:3px;background:var(--line,#344257);border-radius:4px;margin-top:8px;overflow:hidden}#previewUpdateStatus .pus-bar i{display:block;height:100%;width:35%;background:#2f80ff;border-radius:4px;animation:pusmove 1.2s infinite ease-in-out}@keyframes pusmove{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}body.light-theme #previewUpdateStatus{box-shadow:0 12px 30px #0002}
</style>
<div id="previewUpdateStatus" data-state="checking" aria-live="polite">
  <div class="pus-row"><span class="pus-dot"></span><span class="pus-title" id="pusTitle">Đang kiểm tra bản Preview…</span><span class="pus-time" id="pusTime"></span></div>
  <div class="pus-detail" id="pusDetail">Đang kiểm tra commit và trạng thái GitHub Pages.</div>
  <div class="pus-bar" id="pusBar"><i></i></div>
  <div class="pus-actions"><button id="pusCheck">↻ Kiểm tra ngay</button><button id="pusReload">⟳ Reload Preview</button></div>
</div>
<script>
(function(){
  const owner='studywithnhu02',repo='english-collocations',branch='main';
  const box=document.getElementById('previewUpdateStatus'),title=document.getElementById('pusTitle'),detail=document.getElementById('pusDetail'),time=document.getElementById('pusTime'),bar=document.getElementById('pusBar');
  const key='preview-update-status-last-sha';
  function state(s,t,d,loading){box.dataset.state=s;title.textContent=t;detail.textContent=d;time.textContent=new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});bar.style.display=loading?'block':'none'}
  async function getJson(url){const r=await fetch(url,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
  async function check(){
    state('checking','Đang kiểm tra bản Preview…','Đang đọc commit mới nhất và trạng thái GitHub Pages.',true);
    try{
      const c=await getJson(`https://api.github.com/repos/${owner}/${repo}/commits/${branch}`);
      const sha=c.sha, short=sha.slice(0,7), local=localStorage.getItem(key);
      const deployments=await getJson(`https://api.github.com/repos/${owner}/${repo}/pages/deployments?per_page=5`);
      const dep=Array.isArray(deployments)?deployments[0]:null;
      const status=dep&&dep.status?String(dep.status).toLowerCase():'';
      const liveSha=dep&&dep.sha?dep.sha:'';
      if(liveSha && liveSha===sha){localStorage.setItem(key,sha);state('ok','🟢 Preview đã cập nhật',`Live commit ${short} · GitHub Pages đã deploy xong.`,false);return}
      if(local && local===sha && !liveSha){state('ok','🟢 Preview đang ở bản mới nhất',`Commit ${short} · chưa có thông tin Pages deployment.`,false);return}
      if(status==='queued'||status==='in_progress'||status==='building'||status==='pending'){state('new','🔵 Đang cập nhật Preview',`Commit ${short} đã lên GitHub · Pages đang deploy (${status}).`,true);return}
      if(liveSha && liveSha!==sha){state('new','🟡 Có bản Preview mới',`GitHub đã có ${short}, nhưng Pages chưa chạy xong.`,true);return}
      localStorage.setItem(key,sha);state('ok','🟢 Đã kiểm tra',`Commit hiện tại ${short}.`,false);
    }catch(e){state('error','🔴 Không kiểm tra được',`GitHub API/Pages chưa phản hồi: ${e.message}`,false)}
  }
  document.getElementById('pusCheck').addEventListener('click',check);
  document.getElementById('pusReload').addEventListener('click',()=>location.reload());
  check();setInterval(check,15000);
})();
</script>'''
          if '</body>' not in s:
              raise SystemExit('preview/index.html has no </body> marker; no changes made')
          s = s.replace('</body>', block + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit injected widget
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Preview deployment status widget"
            git push
          fi
