name: Install browser AI Agent in Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Agent into Preview
        shell: python
        run: |
          from pathlib import Path
          p = Path('preview/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script type="module" src="./ai-agent.js"></script>'
          if marker not in s:
              s = s.replace('</body>', f'{marker}\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          print('Browser AI Agent injection:', 'present' if marker in s else 'missing')

      - name: Remove obsolete Ollama bridge
        shell: bash
        run: |
          rm -f preview/ollama-bridge/server.py
          rmdir preview/ollama-bridge 2>/dev/null || true

      - name: Commit Preview migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/index.html preview/ai-agent.js preview/ai-agent-worker.js preview/ollama-bridge || true
          if git diff --cached --quiet; then
            echo "No migration changes needed."
            exit 0
          fi
          git commit -m "Replace Ollama Workspace with browser-local AI Agent"
          git push
